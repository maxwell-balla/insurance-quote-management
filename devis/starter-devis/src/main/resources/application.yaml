quote:
  pricing:
    default-price: 500.00

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/devis_db
    username: devis_user
    password: devis_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

  application:
    name: devis-service

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: devis-service
            client-secret: 3JEXplLQJ2fQRBG8UixMtGn5svMGLZFP
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:9090/realms/iqmrealm/protocol/openid-connect/token

logging:
  level:
    org:
      springframework: DEBUG
      slf4j: DEBUG
      testcontainers: DEBUG
    # Resilience4j logging
    io.github.resilience4j: DEBUG
    com.playground.inproc.service: DEBUG

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

pricing:
  url: http://localhost:8081

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      pricingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

  retry:
    instances:
      pricingService:
        maxAttempts: 3
        waitDuration: 10s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException